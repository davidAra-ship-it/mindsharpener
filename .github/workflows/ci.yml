name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # necesario para crear releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: mindsharpener-chrome
          path: .output/*-chrome.zip

      # Al subir una etiqueta (p. ej. v0.2.0) se publica una release con el .zip.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*-chrome.zip
          generate_release_notes: true
